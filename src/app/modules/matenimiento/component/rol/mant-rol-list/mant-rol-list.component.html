<div class="container my-4">
  <!-- Encabezado Principal -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-dark m-0">Lista de Asignaciones</h2>
      <p class="text-muted small m-0">Gestiona y filtra los roles registrados en el sistema</p>
    </div>
    <button (click)="crearRol(modalEdit)" class="btn btn-success px-3 shadow-sm">
      <i class="fas fa-plus me-1"></i> Crear Rol
    </button>
  </div>

  <!-- Formulario de Búsqueda -->
  <form [formGroup]="myFormFilter" class="card border-0 shadow-sm rounded-3 mb-4">
    <div class="card-body p-4">
      <h6 class="card-subtitle mb-3 text-muted fw-bold text-uppercase small">
        <i class="fas fa-filter me-1"></i> Filtros de búsqueda
      </h6>
      <div class="row g-3 align-items-end">
        <div class="col-md-6 col-lg-5">
          <label for="nombreRol" class="form-label small fw-semibold text-secondary">Nombre de la asignación</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted">
              <i class="fas fa-search"></i>
            </span>
            <input 
              id="nombreRol"
              type="text" 
              class="form-control bg-light border-start-0" 
              formControlName="nombreRol" 
              placeholder="Ej. Administrador, Supervisor...">
          </div>
        </div>

        <div class="col-md-6 col-lg-4 d-flex gap-2">
          <button type="button" (click)="listarFiltro()" class="btn btn-primary px-4 shadow-sm">
            <i class="fas fa-search me-1"></i> Buscar
          </button>
          <button type="button" (click)="limpiarFiltros()" class="btn btn-outline-secondary px-3">
            <i class="fas fa-broom me-1"></i> Limpiar
          </button>
        </div>
      </div>
    </div>
  </form>

  <!-- Tabla de Resultados -->
  <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
    <!-- Barra superior de la tabla -->
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-0">
      <div class="d-flex align-items-center gap-2">
        <span class="text-muted small">Mostrar:</span>
        <select (change)="changeItemsPerPage()" [(ngModel)]="itemsPerPage" class="form-select form-select-sm w-auto">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
        <span class="text-muted small">registros</span>
      </div>

      <span *ngIf="!mostrarListaCompleta" class="badge bg-info text-dark">
        <i class="fas fa-info-circle me-1"></i> Resultados filtrados
      </span>
    </div>

    <!-- Cuerpo de la Tabla -->
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-secondary">
          <tr>
            <th scope="col" class="ps-4" style="width: 80px;">ID</th>
            <th scope="col">Nombre Rol</th>
            <th scope="col">Descripción</th>
            <th scope="col" class="text-end pe-4">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let rol of Rol">
            <td class="ps-4 fw-bold text-muted">#{{rol.irol}}</td>
            <td>
              <span class="fw-semibold text-dark">{{rol.nombreRol}}</span>
            </td>
            <td class="text-muted">{{rol.descripRol || 'Sin descripción'}}</td>
            <td class="text-end pe-4">
              <div class="btn-group btn-group-sm" role="group">
                <button 
                  (click)="editarRol(modalEdit, rol)" 
                  class="btn btn-outline-primary" 
                  title="Editar">
                  <i class="fas fa-edit"></i>
                </button>
                <button 
                  *ngIf="!mostrarListaCompleta" 
                  (click)="eliminarRol(rol.irol)" 
                  class="btn btn-outline-danger" 
                  title="Eliminar">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </td>
          </tr>
          <!-- Estado vacío cuando no hay registros -->
          <tr *ngFor="let rol of Rol">
            <td *ngIf="Rol?.length === 0" colspan="4" class="text-center py-5 text-muted">
              <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
              No se encontraron registros
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginación (solo si está en vista completa) -->
    <div *ngIf="mostrarListaCompleta" class="card-footer bg-white border-0 py-3 d-flex justify-content-center">
      <pagination 
        (pageChanged)="changePage($event)" 
        [totalItems]="totalItems" 
        [itemsPerPage]="itemsPerPage" 
        previousText="&laquo; Anterior" 
        nextText="Siguiente &raquo;"
        class="pagination-sm mb-0">
      </pagination>
    </div>
  </div>

  <!-- Modal para Crear/Editar Rol -->
  <ng-template #modalEdit>
    <app-mant-rol-registrer
      [title]="titleModal"
      [rol]="rolSelect"
      [accion]="accionModal"
      (closeModalEmmit)="getCloseModalEmmit($event)">
    </app-mant-rol-registrer>
  </ng-template>
</div>
