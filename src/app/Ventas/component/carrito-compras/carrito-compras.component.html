<app-welcome-header></app-welcome-header>

<div class="cart-container">

    <!-- TÍTULO -->
    <h1 class="cart-title">
        🛒 Carrito de Compras
    </h1>

    <div class="cart-content">

        <!-- PRODUCTOS -->
        <div class="cart-products">

            <div class="cart-item" *ngFor="let item of carrito">

                <!-- IMAGEN -->
                 <img
                [src]="'data:image/jpeg;base64,' + item.producto.fotografia"
                width="80"
                height="80">
                

                <!-- INFORMACIÓN -->
                <div class="cart-item-details">

                    <h2 class="cart-item-name">
                        {{ item.producto.nombreProd }}
                    </h2>

                    <p class="cart-item-description">
                        Producto disponible en stock.
                    </p>

                    <div class="cart-item-price">
                        S/. {{ item.producto.precioUnitario }}
                    </div>

                    <!-- CANTIDAD -->
                    <div class="cart-item-quantity">

                        <button
                            class="btn-quantity"
                            (click)="quitar1(item)">
                            -
                        </button>

                        <span class="quantity-number">
                            {{ item.cantidad }}
                        </span>

                        <button
                            class="btn-quantity"
                            (click)="agregar1(item)">
                            +
                        </button>

                    </div>

                </div>

                <!-- TOTAL -->
                <div class="cart-item-total">

                    <h4>Subtotal</h4>

                    <div class="cart-item-price">
                        S/. {{ item.producto.precioUnitario * item.cantidad }}
                    </div>

                    <br>

                    <button
                        class="btn-delete"
                        (click)="eliminarProducto(item)">
                        🗑 Eliminar
                    </button>

                </div>

            </div>

            <!-- SI EL CARRITO ESTÁ VACÍO -->
            <div *ngIf="carrito.length == 0" style="text-align:center;padding:60px;">

                <img
                    src="assets/img/Persona.jpg"
                    width="250"
                    alt="Carrito lleno">

                  <!-- <h2>No hay productos en el carrito</h2>  -->

                <!-- <p>
                    Agrega algunos productos para comenzar tu compra.
                </p> -->

            </div>

        </div>

        <!-- RESUMEN -->
        <div class="cart-summary">

            <h2 class="summary-title">
                Resumen de Compra
            </h2>

            <div class="summary-row">
                <span>Productos</span>
                <span>{{ carrito.length }}</span>
            </div>

            <div class="summary-row">
                <span>Envío</span>
                <span>Gratis</span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span>S/. {{ total }}</span>
            </div>

            <button
                class="btn-pay"
                (click)="irAPagar()">
                Finalizar Compra
            </button>

        </div>

    </div>

</div>
