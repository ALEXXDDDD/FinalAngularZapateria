<div class="bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden max-w-3xl mx-auto">
  
  <!-- Encabezado del Modal -->
  <div class="bg-slate-800 px-6 py-4 flex items-center justify-between border-b border-gray-200">
    <h3 class="text-lg font-bold text-white tracking-wide uppercase flex items-center gap-2">
      <i class="fa-solid fa-box text-blue-400"></i>
      {{ title }}
    </h3>
    <button 
      type="button" 
      (click)="cerrarModal(true)" 
      class="text-slate-400 hover:text-white transition-colors duration-150 focus:outline-none"
      aria-label="Cerrar">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </div>

  <!-- Cuerpo del Modal (Formulario) -->
  <div class="p-6">
    <form [formGroup]="myForm" (ngSubmit)="guardar()">
      
      <!-- Campos del Formulario Organizados en Grilla -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        
        <!-- Código Producto (Autogenerado) -->
        <div>
          <label for="codigoProd" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Código Producto <span class="text-blue-500 font-normal lowercase">(auto)</span>
          </label>
          <input 
            id="codigoProd" 
            type="text" 
            formControlName="codigoProd" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 bg-gray-100 focus:outline-none" 
            placeholder="Se genera automáticamente" 
            readonly>
          <small class="text-gray-500 text-[11px] block mt-1">Formato: PRODUCT-[3 cat]-[3 col]</small>
        </div>

        <!-- Nombre del Producto -->
        <div class="md:col-span-2">
          <label for="nombre" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Nombre del Producto <span class="text-red-500">*</span>
          </label>
          <input 
            id="nombre" 
            type="text" 
            formControlName="nombreProd" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            placeholder="Ej. Zapatillas Urbanas">
        </div>

        <!-- Categoría / Modelo -->
        <div>
          <label for="categoria" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Categoría / Modelo <span class="text-red-500">*</span>
          </label>
          <select 
            id="categoria" 
            formControlName="nombreModelo" 
            class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="" disabled selected>Selecciona un Modelo</option>
            <option *ngFor="let d of responseModelo" [value]="d.nombreModelo">{{ d.nombreModelo }}</option>
          </select>
        </div>

        <!-- Color -->
        <div>
          <label for="color" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Color <span class="text-red-500">*</span>
          </label>
          <input 
            id="color" 
            type="text" 
            formControlName="color" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            placeholder="Ej. Negro, Blanco">
        </div>

        <!-- Talla -->
        <div>
          <label for="talla" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Talla <span class="text-red-500">*</span>
          </label>
          <input 
            id="talla" 
            type="text" 
            formControlName="talla" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            placeholder="Ej. 41, XL">
        </div>

        <!-- Precio Unitario -->
        <div>
          <label for="precioUnitario" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Precio <span class="text-red-500">*</span>
          </label>
          <div class="relative rounded-lg shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500 font-semibold text-sm">
              S/
            </div>
            <input 
              id="precioUnitario" 
              type="number" 
              step="0.01" 
              formControlName="precioUnitario" 
              class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
              placeholder="0.00">
          </div>
        </div>

        <!-- Stock -->
        <div>
          <label for="stock" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Stock <span class="text-red-500">*</span>
          </label>
          <input 
            id="stock" 
            type="number" 
            formControlName="stock" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            [placeholder]="accion === 1 ? 'Stock inicial: 0' : 'Debe ser mayor a 0'" 
            [value]="accion === 1 ? 0 : ''">
          <small *ngIf="accion === 1" class="text-blue-500 text-[11px] block mt-1">Nuevo producto: Stock forzosamente 0</small>
        </div>

        <!-- Unidad -->
        <div>
          <label for="nombreUnidad" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Unidad <span class="text-red-500">*</span>
          </label>
          <select 
            id="nombreUnidad" 
            formControlName="idUnidad" 
            class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="" disabled selected>Selecciona Unidad</option>
            <option value="nombreUnidad">PARES</option>
          </select>
        </div>

      </div>
<input 
  type="file" 
  accept="image/*" 
  (change)="onFileSelected($event)" />

<!-- Previsualización opcional de la imagen -->
<img *ngIf="producto.fotografia" [src]="producto.fotografia" style="max-width: 200px;" />
      <!-- Descripción (Ancho completo) -->
      <div class="mt-5">
        <label for="descripcion" class="block text-xs font-bold text-slate-600 uppercase mb-2">
          Descripción
        </label>
        <textarea 
          id="descripcion" 
          rows="3" 
          formControlName="descripcion" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
          placeholder="Escriba los detalles del producto..."></textarea>
      </div>

      <!-- Pie del Modal (Acciones) -->
      <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-end space-x-2">
        <button 
          type="button" 
          (click)="cerrarModal(true)" 
          class="inline-flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm px-4 py-2 rounded-lg transition-colors duration-150">
          <span>Cancelar</span>
        </button>

        <button 
          type="submit" 
          [disabled]="myForm.invalid" 
          class="inline-flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold text-sm px-5 py-2 rounded-lg shadow-sm transition-colors duration-150">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>Guardar</span>
        </button>
      </div>

    </form>
  </div>
</div>
