<div class="bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden max-w-4xl mx-auto">
  
  <!-- Encabezado del Modal -->
  <div class="bg-slate-800 px-6 py-4 flex items-center justify-between border-b border-gray-200">
    <h3 class="text-lg font-bold text-white tracking-wide uppercase flex items-center gap-2">
      <i class="fa-solid fa-user-gear text-blue-400"></i>
      {{ title }}
    </h3>
    <button 
      type="button" 
      (click)="cerrarModal(true)" 
      class="text-slate-400 hover:text-white transition-colors duration-150 focus:outline-none"
      aria-label="Cerrar">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </div>

  <!-- Cuerpo del Modal (Formulario) -->
  <div class="p-6">
    <form [formGroup]="myForm" (ngSubmit)="guardar()">
      
      <!-- Sección: Identificación y Búsqueda -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        
        <!-- ID Empleado -->
        <div class="md:col-span-3">
          <label for="idEmpleado" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            ID Empleado <span class="text-blue-500 font-normal lowercase">(auto)</span>
          </label>
          <input 
            id="idEmpleado" 
            type="text" 
            formControlName="idEmpleado" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 bg-gray-100 focus:outline-none" 
            placeholder="Autogenerado" 
            readonly>
        </div>

        <!-- Tipo Documento -->
        <div class="md:col-span-3">
          <label for="tipoP" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Tipo Documento
          </label>
          <select 
            id="tipoP" 
            formControlName="tipoDocumento" 
            class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="" disabled selected>Seleccione...</option>
            <option value="DNI">DNI</option>
          </select>
        </div>

        <!-- N° Documento + Búsqueda -->
        <div class="md:col-span-6">
          <label for="ndoc" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            N° Documento
          </label>
          <div class="flex rounded-lg shadow-sm">
            <input 
              id="ndoc" 
              type="text" 
              formControlName="numeroDocumento" 
              class="flex-1 min-w-0 block w-full px-3 py-2 rounded-l-lg border border-gray-300 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
              placeholder="Ingrese número"
              [class.border-red-500]="myForm.get('numeroDocumento')?.invalid && myForm.get('numeroDocumento')?.touched">
            <button 
              type="button" 
              (click)="buscar()" 
              class="inline-flex items-center px-4 py-2 border border-l-0 border-blue-600 rounded-r-lg bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white font-medium text-sm transition-colors duration-150">
              <i class="fa-solid fa-magnifying-glass me-1.5"></i> Buscar
            </button>
          </div>
          <p 
            *ngIf="myForm.get('numeroDocumento')?.hasError('minlength') && myForm.get('numeroDocumento')?.touched" 
            class="mt-1 text-xs text-red-500">
            Mínimo 8 caracteres.
          </p>
        </div>

      </div>

      <hr class="my-5 border-gray-200">

      <!-- Sección: Datos Personales -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-4">
        
        <!-- Nombres -->
        <div class="lg:col-span-4">
          <label for="nombres" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Nombres
          </label>
          <input 
            id="nombres" 
            type="text" 
            formControlName="nombres" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            placeholder="Ej. Juan Carlos">
        </div>

        <!-- Apellido Paterno -->
        <div class="lg:col-span-4">
          <label for="apellidoPaterno" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Apellido Paterno
          </label>
          <input 
            id="apellidoPaterno" 
            type="text" 
            formControlName="apellidoPaterno" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            placeholder="Ej. Pérez">
        </div>

        <!-- Apellido Materno -->
        <div class="lg:col-span-4">
          <label for="apellidoMaterno" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Apellido Materno
          </label>
          <input 
            id="apellidoMaterno" 
            type="text" 
            formControlName="apellidoMaterno" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            placeholder="Ej. Gómez">
        </div>

        <!-- Asignación / Rol -->
        <div class="lg:col-span-4">
          <label for="nombreRol" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Asignación
          </label>
          <select 
            id="nombreRol" 
            formControlName="nombreRol" 
            class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="" disabled selected>Seleccione...</option>
            <option *ngFor="let r of roles" [value]="r.nombreRol">{{ r.nombreRol }}</option>
          </select>
        </div>

        <!-- Correo Electrónico -->
        <div class="lg:col-span-8">
          <label for="email" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Correo Electrónico
          </label>
          <div class="relative rounded-lg shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-envelope text-xs"></i>
            </div>
            <input 
              id="email" 
              type="email" 
              formControlName="email" 
              class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
              placeholder="correo@ejemplo.com">
          </div>
        </div>

      </div>

      <hr class="my-5 border-gray-200">

      <!-- Sección: Cuenta y Datos Laborales -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- Usuario -->
        <div>
          <label for="usuario1" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Usuario
          </label>
          <input 
            id="usuario1" 
            type="text" 
            formControlName="usuario1" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            placeholder="jperez">
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Contraseña
          </label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            placeholder="••••••••"
            [class.border-red-500]="myForm.get('password')?.invalid && myForm.get('password')?.touched">
          <p 
            *ngIf="myForm.get('password')?.hasError('minlength') && myForm.get('password')?.touched" 
            class="mt-1 text-xs text-red-500">
            Mínimo 8 caracteres.
          </p>
        </div>

        <!-- Sueldo -->
        <div>
          <label for="sueldo" class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Sueldo
          </label>
          <div class="relative rounded-lg shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500 font-semibold text-sm">
              S/
            </div>
            <input 
              id="sueldo" 
              type="number" 
              step="0.01" 
              formControlName="salario" 
              class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-lg text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
              placeholder="0.00">
          </div>
        </div>

      </div>

      <!-- Pie del Modal (Acciones) -->
      <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-end space-x-2">
        <button 
          type="button" 
          (click)="cerrarModal(true)" 
          class="inline-flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm px-4 py-2 rounded-lg transition-colors duration-150">
          <span>Cancelar</span>
        </button>
        
        <button 
          type="submit" 
          [disabled]="myForm.invalid" 
          class="inline-flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold text-sm px-5 py-2 rounded-lg shadow-sm transition-colors duration-150">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>Guardar</span>
        </button>
      </div>

    </form>
  </div>
</div>
